name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            extra_configure_args: ""
          - compiler: clang
            cc: clang
            cxx: clang++
            # Ubuntu's clang + libstdc++ cannot compile <expected> at all: clang reports __cpp_concepts
            # as the C++20 TS value 201907L rather than 202002L, which gates libstdc++'s <expected> off
            # entirely (a real toolchain gap, confirmed against Sub0MemPage's own headers too, not a bug
            # in this project's code). Build against libc++ instead -- see README.md's own note.
            extra_configure_args: "-DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++"
    steps:
      - uses: actions/checkout@v4
      - name: Install libc++ (clang + libstdc++'s <expected> gap)
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y libc++-18-dev libc++abi-18-dev
      - name: Configure
        run: cmake --preset ci-unix ${{ matrix.extra_configure_args }}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset ci-unix
      - name: Test
        run: ctest --preset ci-unix

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ci-msvc
      - name: Build
        run: cmake --build --preset ci-msvc
      - name: Test
        run: ctest --preset ci-msvc

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ci-unix
      - name: Build
        run: cmake --build --preset ci-unix
      - name: Test
        run: ctest --preset ci-unix

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (ASan + UBSan)
        run: cmake --preset ci-asan
        env:
          CC: gcc
          CXX: g++
      - name: Build
        run: cmake --build --preset ci-asan
      - name: Test
        run: ctest --preset ci-asan

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (TSan)
        run: cmake --preset ci-tsan
        env:
          CC: gcc
          CXX: g++
      - name: Build
        run: cmake --build --preset ci-tsan
      # R5's coalescing claim and the whole slot state machine are concurrency claims (AGENTS.md sec 10)
      # -- TSan is a hard CI gate, not an optional extra, alongside ASan/UBSan.
      - name: Test
        run: ctest --preset ci-tsan
